services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chanakya
      POSTGRES_PASSWORD: chanakya
      POSTGRES_DB: chanakya
    ports:
      - "5432:5432"
    volumes:
      - chanakya-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chanakya -d chanakya"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chanakya-db:
